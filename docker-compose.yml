services:
  mongo:
    image: mongo:6.0
    container_name: mtender_mongo
    restart: unless-stopped
    # A replica set (even a single-member one) is required for multi-document
    # transactions; a standalone mongod silently has no session support.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - .mongo/data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Runs replSetInitiate once, then exits. Compose depends_on with
  # condition: service_completed_successfully keeps "docker compose up" a
  # one-liner that ends with a usable cluster.
  mongo-init:
    image: mongo:6.0
    container_name: mtender_mongo_init
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try {
            rs.status();
            print("replica set already initiated");
          } catch (e) {
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]});
            print("replica set initiated");
          }
        '
