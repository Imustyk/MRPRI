# Contract matrix (матрица контракта) — the fixed acceptance agreement between
# the business and the model. Machine-readable source of truth; the human
# report is docs/contract_matrix.md.
#
# Acceptance rule: the model is ACCEPTED only when every row is "met" or a
# documented "not_verifiable". Any "unmet" row fails the contract.
# scripts/23_check_contract.py recomputes every verifiable status from the
# artefacts of the last cycle and exits non-zero on any of:
#   * a row recorded as "met"/"unmet" whose artefact no longer agrees,
#   * a metric whose artefact (data source) is missing,
#   * a model KPI without at least one existing business KPI,
#   * a "not_verifiable" row without a documented reason and doc reference.
#
# Row schema:
#   id            unique row id (B* business, M* model)
#   title         short name (RU)
#   type          business | model
#   linked_to     for model KPIs: >= 1 business KPI id (required)
#   source        corpus | external | split | tooling
#   metric        metric and formula
#   threshold     acceptance threshold (mirrors check + comparator + limit)
#   check         id in the checker's registry (null only for not_verifiable)
#   comparator    ">=" | "<=" | ">" | "<" | "=="
#   limit         numeric threshold the computed value is compared against
#   artifact       file the value is recomputed from (must exist on disk)
#   status        met | unmet | not_verifiable — recorded 2026-10-17
#   note          evidence / current value
#   verifiable    false => reason + doc_ref are mandatory

meta:
  version: 1
  frozen_at: "2026-10-17"
  scope: "production band configuration (v0 baseline, votes >= 3 of 4 detectors)"
  acceptance_rule: "model accepted iff every row is 'met' or a documented 'not_verifiable'"
  checker: scripts/23_check_contract.py
  human_report: docs/contract_matrix.md
  provenance: docs/data_provenance.md
  disclaimer: "Indicators of potential risk, not evidence of corruption."

rows:
  # ------------------------------------------------------------------
  # Business KPIs — what the business gets if the model is accepted
  # ------------------------------------------------------------------
  - id: B1
    title: "Обогащение верхнего списка внешней меткой"
    type: business
    linked_to: []
    source: external
    metric: "precision@200 против метки AAP (доля позитивов в топ-200 ранжирования max_score)"
    threshold: "precision@200 >= 3x базовой доли корпуса (3 x 0.415% = 1.24%)"
    check: precision_at_200_all
    comparator: ">="
    limit: 0.0124
    artifact: results/tables/external_metrics.csv
    status: unmet
    note: "0 совпадений в топ-200 (precision@200 = 0.0)"

  - id: B2
    title: "Экономическая польза экранинга"
    type: business
