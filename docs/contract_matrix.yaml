    source: split
    metric: "cost = c_miss*FN + FP при c_miss=200: стоимость правила votes>=3 / стоимость «ничего не флагировать», tuning 2018-2021"
    threshold: "отношение < 1.0 (правило дешевле, чем не флагировать ничего)"
    check: cost_ratio_vs_no_flag_tuning_c200
    comparator: "<"
    limit: 1.0
